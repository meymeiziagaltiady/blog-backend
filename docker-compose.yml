version: "3.9"

services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - blog_backend:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - blog_backend

  backend:
    build: .
    depends_on:
      - db
    ports:
      - "${APP_PORT}:8000"
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - blog_backend

volumes:
  blog_backend:

networks:
  blog_backend: